<!doctype html>
<!-- What only this app does, lifted out. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .lift-1 { --x: 0; --y: 53; --w: 100; --h: 19; }
      [data-device="iPad"] .lift-1 { --x: 0; --y: 85; --w: 100; --h: 10; }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="stage">
      <div class="phone">
        <div class="screen"><img class="capture" data-capture="{capture:3}" alt="" /></div>
        <div class="lifted">
          <div class="layer lift-1"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
