<!doctype html>
<!-- How to start. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .lift-1 { --x: 4; --y: 34.5; --w: 92; --h: 10.5; }
      [data-device="iPad"] .lift-1 { --x: 1.5; --y: 22; --w: 97; --h: 7; }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="stage">
      <div class="phone">
        <div class="screen"><img class="capture" data-capture="{capture:5}" alt="" /></div>
        <div class="lifted">
          <div class="layer lift-1"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
