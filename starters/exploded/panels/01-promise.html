<!doctype html>
<!--
  The opening panel: the promise, its screen taken apart the most. Each .layer
  is a region of the capture lifted off the screen, placed below as --x --y --w
  --h in percent of the capture: x and y its top left corner, w and h its size.
  --z lifts a layer more steps and --zoom grows it more. A screen lays out
  differently on a squarer display, so the regions fork on [data-form="tablet"], and on its
  side on the orientation query, which repeats the squarer slots' regions since
  their upright rule outranks a bare one; fork a language the same way with
  :lang(de), and drop a layer there with display: none.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .lift-1 { --x: 4; --y: 23; --w: 92; --h: 10.5; }
      .lift-2 { --x: 4; --y: 46; --w: 92; --h: 11; --z: 2; }
      [data-form="tablet"] .lift-1 { --x: 1.5; --y: 14; --w: 97; --h: 6.5; }
      [data-form="tablet"] .lift-2 { --x: 1.5; --y: 30; --w: 97; --h: 7.5; }
      @media (orientation: landscape) {
        .lift-1 { --x: 30; --y: 21.5; --w: 68; --h: 12; }
        .lift-2 { --x: 30; --y: 49.5; --w: 68; --h: 12; }
        [data-form="tablet"] .lift-1 { --x: 30; --y: 21.5; --w: 68; --h: 12; }
        [data-form="tablet"] .lift-2 { --x: 30; --y: 49.5; --w: 68; --h: 12; }
      }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="stage">
      <div class="phone">
        <div class="screen"><img class="capture" data-capture="{capture:1}" alt="" /></div>
        <div class="lifted">
          <div class="layer lift-1"></div>
          <div class="layer lift-2"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
