<!doctype html>
<!--
  The product page header: the top of the product page, 21:9, shot once per
  locale. The words stay in the middle, where every device shows them; what
  stands either side may be cropped. Its words are "header" in strings/.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body data-swatch="1">
    <style>
      .back { --x: 3; --y: 30; --h: 96; --r: -8; }
      .front { --x: 82; --y: 18; --h: 100; --r: 6; }
    </style>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="phone back">
      <div class="screen"><img class="capture" data-capture="{capture:2}" alt="" /></div>
    </div>
    <div class="phone front">
      <div class="screen"><img class="capture" data-capture="{capture:1}" alt="" /></div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
