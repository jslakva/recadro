<!doctype html>
<!-- How to start, with a note on the first thing to tap. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .first { --x: 50; --y: 49; }
      [data-device="iPad"] .first { --x: 19; --y: 31.8; }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen">
        <img class="capture" data-capture="{capture:5}" alt="" />
      </div>
      <div class="marks">
        <div class="note right first"><span class="label" data-string="first"></span></div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
