<!doctype html>
<!--
  The part people come back for, lit: .spot is the region --x --y --w --h below,
  in percent of the capture, and everything else on the screen dims.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .spot { --x: 4; --y: 17.6; --w: 92; --h: 6; }
      .first { --x: 50; --y: 23.6; }
      [data-device="iPad"] .spot { --x: 1.5; --y: 9.3; --w: 97; --h: 4; }
      [data-device="iPad"] .first { --x: 30; --y: 13.3; }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen">
        <img class="capture" data-capture="{capture:2}" alt="" />
        <div class="spot"></div>
      </div>
      <div class="marks">
        <div class="note left first"><span class="label" data-string="first"></span></div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
