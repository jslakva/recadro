<!doctype html>
<!--
  The opening panel: the promise, with two notes on the screen. Each .note lands
  on --x --y below, in percent of the capture, with its label past the left or
  right edge of the phone as its class says; the label is the string named like
  the note. A screen lays out differently on a squarer display, so the points fork on
  [data-form="tablet"], and on its side on the orientation query, which
  repeats their points since their upright rule outranks a bare one;
  fork a language the same way with :lang(de), where a longer label may want
  the other side.
  A slot where the app lays its screens out as neither shape forks on its own
  name after the squarer rule: the points for [data-device="Duo"].
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .first { --x: 50; --y: 27.3; }
      .second { --x: 40; --y: 54; }
      [data-form="tablet"] .first { --x: 23; --y: 16.3; }
      [data-form="tablet"] .second { --x: 76; --y: 24.5; }
      [data-device="Duo"] .first { --x: 45; --y: 33.5; }
      [data-device="Duo"] .second { --x: 40; --y: 69.5; }
      @media (orientation: landscape) {
        .first { --x: 14; --y: 24; }
        .second { --x: 60; --y: 41.5; }
        [data-form="tablet"] .first { --x: 14; --y: 24; }
        [data-form="tablet"] .second { --x: 60; --y: 41.5; }
      }
    </style>
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen">
        <img class="capture" data-capture="{capture:1}" alt="" />
      </div>
      <div class="marks">
        <div class="note left first"><span class="label" data-string="first"></span></div>
        <div class="note right second"><span class="label" data-string="second"></span></div>
      </div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
