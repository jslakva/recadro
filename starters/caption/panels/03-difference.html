<!doctype html>
<!--
  What only this app does, with a slice of the screen enlarged in a strip across
  the whole panel. The region is "detail" in strings/, in percent of the
  capture: x and y its top left corner, w and h its size. Give one per slot,
  keyed "iPhone" and "iPad", when the screen lays out differently on iPad.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen"><img class="capture" alt="" /></div>
    </div>
    <figure class="detail strip"><img class="detail-capture" alt="" /></figure>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
