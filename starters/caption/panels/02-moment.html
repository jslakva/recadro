<!doctype html>
<!-- The moment it works, over a blurred copy of its own capture. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body data-ground="blur">
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen"><img class="capture" data-capture="{capture:2}" alt="" /></div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
