<!doctype html>
<!-- The opening panel: the promise, with a highlighted word and a stroke drawn under it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body data-decor="underline">
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen"><img class="capture" data-capture="{capture:1}" alt="" /></div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
