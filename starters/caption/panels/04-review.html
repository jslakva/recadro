<!doctype html>
<!--
  A review, and no screen, over the set's own background image in assets/:
  the panel that ships without a capture. The quote and
  the reviewer in strings/ are made up for the starter — replace them with a
  real review, since a testimonial nobody gave misleads whoever reads the listing.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body data-ground="image">
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <figure class="review">
      <div class="stars" aria-label="five stars">★★★★★</div>
      <blockquote data-string="quote"></blockquote>
      <figcaption>
        <span class="name" data-string="name"></span>
        <span class="role" data-string="role"></span>
      </figcaption>
    </figure>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
