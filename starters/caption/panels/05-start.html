<!doctype html>
<!-- How to start, with a sticker on the device: one short word. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body>
    <header class="copy">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <div class="device">
      <div class="screen"><img class="capture" data-capture="{capture:2}" alt="" /></div>
      <span class="badge" data-string="badge"></span>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
