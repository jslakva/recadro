<!doctype html>
<!--
  The search result image: shown in place of the screenshots in a search
  result, 3:2, shot once per locale. Say plainly what the app does; the
  headline and the top of the screen sit in the middle, where it is never
  cropped. Its words are "search" in strings/.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body data-ground="blur">
    <header class="copy">
      <h1 data-string="headline"></h1>
    </header>
    <div class="device">
      <div class="screen"><img class="capture" data-capture="{capture:1}" alt="" /></div>
    </div>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
