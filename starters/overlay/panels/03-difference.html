<!doctype html>
<!--
  What only this app does, with a round magnifier over part of the screen. The
  part is --x --y --w --h below, in percent of the capture: x and y its top left
  corner, w and h its size. The magnifier sits over its middle and fills with
  its width. A screen lays out differently on iPad, so the part forks on
  [data-device="iPad"], and on its side on the orientation query, which
  repeats the iPad's part since the upright iPad rule outranks a bare one; fork
  a language the same way with :lang(de).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
    <style>
      .detail { --x: 26; --y: 59; --w: 40; --h: 12; }
      [data-device="iPad"] .detail { --x: 36; --y: 82; --w: 24; --h: 8; }
      @media (orientation: landscape) {
        .detail { --x: 32; --y: 50; --w: 16; --h: 11; }
        [data-device="iPad"] .detail { --x: 32; --y: 50; --w: 16; --h: 11; }
      }
    </style>
  </head>
  <body>
    <img class="capture" data-capture="{capture:3}" alt="" />
    <figure class="detail loupe"><img class="detail-capture" alt="" /></figure>
    <header class="band">
      <h1 data-string="headline"></h1>
      <p data-string="subline"></p>
    </header>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
