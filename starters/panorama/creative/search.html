<!doctype html>
<!--
  The search results image: shown in place of the screenshots in a search
  result, 3:2, shot once per locale. Say plainly what the app does; the
  headline and the top of the screen sit in the middle, where it is never
  cropped. Its words are "search" in strings/.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../panel.css" />
  </head>
  <body>
    <style>
      .middle { --x: 50; --y: 104; --h: 100; --r: -4; }
    </style>
    <div class="wave back"></div>
    <div class="wave"></div>
    <div class="phones" data-frame="steel">
      <div class="phone middle" data-capture="{capture:1}"><div class="screen"><img alt="" /></div></div>
    </div>
    <header class="copy">
      <h1 data-string="headline"></h1>
    </header>
    <script type="module" src="../panel.js"></script>
  </body>
</html>
